name: Build image

# Two kinds of release:
#   - pushing a tag v1.2.3 publishes a versioned release
#   - every push to main that changes the image rebuilds it and updates the
#     rolling "latest" release (tag `latest`, moved to the new commit), so the
#     "latest release" download link always has the current build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "stage-kiosk/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Native arm64 runner: no qemu emulation (which is broken for trixie
    # builds on x86 runners, see usimd/pi-gen-action#179) and ~10x faster.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build Raspberry Pi image
        id: build
        uses: usimd/pi-gen-action@v1.11.0
        with:
          image-name: pi-video-kiosk
          pi-gen-version: arm64
          release: trixie
          stage-list: stage0 stage1 stage2 ./stage-kiosk
          export-last-stage-only: true
          hostname: kiosk
          username: pi
          password: kiosk
          disable-first-boot-user-rename: true
          enable-ssh: 1
          timezone: Etc/UTC
          compression: xz
          compression-level: 9
          verbose-output: true

      - name: Give the image a stable file name
        id: img
        run: |
          src="${{ steps.build.outputs.image-path }}"
          dst="$(dirname "$src")/pi-video-kiosk.img.xz"
          mv "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-video-kiosk-image
          path: ${{ steps.img.outputs.path }}

      - name: Attach image to versioned release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.img.outputs.path }}
          generate_release_notes: true
          make_latest: true

      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

      - name: Remove stale assets from the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --json assets -q '.assets[].name' 2>/dev/null \
            | grep -vx 'pi-video-kiosk.img.xz' \
            | xargs -r -n1 gh release delete-asset latest -y || true

      - name: Update the rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: ${{ steps.img.outputs.path }}
          body: |
            Automatically built from the latest commit on `main`
            (${{ github.sha }}): ${{ github.event.head_commit.message }}

            Versioned releases are listed below it; this one always tracks `main`.
